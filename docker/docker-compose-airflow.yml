# Local Airflow development environment — do NOT use for production.
#
# Usage:
#   cd <repo-root>
#   echo "AIRFLOW_UID=$(id -u)" > .env   # first time only
#   docker compose -f docker/docker-compose-airflow.yml up -d
#   open http://localhost:8080            # admin / admin
#   docker compose -f docker/docker-compose-airflow.yml down
#
# LOCAL_MODE=true makes every BashOperator echo what it would run
# instead of executing real GCP/dbt commands — safe for local testing.
# Remove LOCAL_MODE (or set to false) when pointing at real GCP.
#
# GCP access (optional):
#   Mount ~/.config/gcloud into the container so gcloud/bq CLI works.
#   Run `gcloud auth application-default login` on the host first.

---
version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.4-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: "/opt/airflow"
    # ── Local mode: tasks echo dry-run messages instead of hitting GCP ────
    LOCAL_MODE: "true"   # set to "false" (or remove) to run against real GCP
  volumes:
    - ${AIRFLOW_PROJ_DIR:-..}/airflow/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-..}/dbt:/opt/airflow/dbt
    - ${AIRFLOW_PROJ_DIR:-..}/scripts:/opt/airflow/scripts
    - ${AIRFLOW_PROJ_DIR:-..}/spark:/opt/airflow/spark
    - ${AIRFLOW_PROJ_DIR:-..}/ingestion:/opt/airflow/ingestion
    - ${AIRFLOW_PROJ_DIR:-..}/logs/airflow:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-..}/airflow/plugins:/opt/airflow/plugins
    # Uncomment to give containers access to host gcloud credentials:
    # - ~/.config/gcloud:/home/airflow/.config/gcloud:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "Airflow init complete."
    environment:
      <<: *airflow-common-env
    restart: on-failure

volumes:
  postgres-db-volume:
