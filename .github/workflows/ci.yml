# CI: runs on every PR — lint, unit tests, terraform validate, dbt parse
# DESIGN.md §11: "On PR: lint (ruff/black), unit tests, terraform validate + fmt -check, dbt parse"

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[lint]"
      - run: ruff check .
      - run: black --check .

  test-ingestion:
    name: Unit tests — ingestion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[ingestion,tests]"
      - run: pytest ingestion/tests -m "not integration"

  test-spark:
    name: Unit tests — PySpark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install ".[spark,tests]"
      - run: pytest spark/tests -m "not integration"

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - working-directory: terraform
        run: terraform init -backend=false
      - working-directory: terraform
        run: terraform validate
      - working-directory: terraform
        run: terraform fmt -check -recursive

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-bigquery
      - name: Create CI profiles.yml
        run: |
          cat > dbt/profiles.yml << 'EOF'
          steam_reviews:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: steam-reviews-platform
                dataset: steam_gold_dev
                threads: 4
          EOF
      - run: dbt parse --profiles-dir dbt --project-dir dbt --no-version-check
